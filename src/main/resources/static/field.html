<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScanIn — Kontragent (Səfər) Paneli</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: radial-gradient(circle at top left, #1e293b, #0f172a 70%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(18px);
            padding: 34px 28px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65);
            text-align: center;
        }

        .brand-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 12px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.35);
        }

        h1 {
            font-size: 23px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 13.5px;
            color: #94a3b8;
            margin-bottom: 22px;
        }

        .emp-badge {
            display: inline-block;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.4);
            color: #fbbf24;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 18px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        input, textarea {
            width: 100%;
            padding: 13px 15px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: rgba(15, 23, 42, 0.85);
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #f59e0b;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15.5px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 6px;
        }

        .btn-amber {
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #0f172a;
        }

        .status-box {
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 16px;
            font-size: 14.5px;
            line-height: 1.5;
        }

        .status-success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid #22c55e;
            color: #bbf7d0;
        }

        .status-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fecaca;
        }

        .hidden {
            display: none !important;
        }

        .link {
            display: inline-block;
            margin-top: 18px;
            color: #38bdf8;
            font-size: 13px;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="brand-icon">🤝</div>
    <h1>Kontragent Səfər Paneli</h1>
    <p class="subtitle">Ofisdən kənarda (müştəri yanında) giriş-çıxış qeydiyyatı</p>

    <div id="empBadge" class="emp-badge hidden">👤 İşçi</div>
    <div id="alertBox" class="status-box hidden"></div>

    <!-- Əgər telefonda login olmayıbsa kiçik giriş: -->
    <div id="loginBox" class="hidden">
        <div class="form-group">
            <label>İstifadəçi Adı (Nickname)</label>
            <input type="text" id="username" placeholder="nickname">
        </div>
        <div class="form-group">
            <label>Şifrə</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <button class="btn btn-amber" onclick="doLogin()">Daxil Ol</button>
    </div>

    <!-- Əsas Kontragent Formu -->
    <div id="fieldForm" class="hidden">
        <div class="form-group">
            <label>🏢 Hansı Kontragentin (Müştərinin) yanındasınız?</label>
            <input type="text" id="counterpartyName" placeholder="Məs: Veyseloglu MMC / Bravo">
        </div>
        <div class="form-group">
            <label>📝 Görülən iş və ya qeyd (ixtiyari):</label>
            <textarea id="visitNote" rows="2" placeholder="Məs: Müqavilə imzalanması və akt təhvili"></textarea>
        </div>
        <button class="btn btn-amber" onclick="submitFieldVisit()">📍 Giriş / Çıxışı Təsdiqlə (HR-a Göndər)</button>
    </div>

    <a href="/index.html" class="link">⬅️ Əsas Ofis QR Səhifəsinə Qayıt</a>
</div>

<script>
    const TOKEN_KEY = 'scanin_jwt_token';
    const USER_INFO_KEY = 'scanin_user_info';

    window.onload = () => {
        const token = localStorage.getItem(TOKEN_KEY);
        const info = localStorage.getItem(USER_INFO_KEY);
        if (!token) {
            document.getElementById('loginBox').classList.remove('hidden');
        } else {
            if (info) {
                const badge = document.getElementById('empBadge');
                badge.innerText = '👤 ' + info;
                badge.classList.remove('hidden');
            }
            document.getElementById('fieldForm').classList.remove('hidden');
        }
    };

    function showAlert(msg, isError) {
        const box = document.getElementById('alertBox');
        box.className = 'status-box ' + (isError ? 'status-error' : 'status-success');
        box.innerText = msg;
        box.classList.remove('hidden');
    }

    async function doLogin() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });
        const data = await res.json();
        if (!res.ok) {
            showAlert(data.message || 'Giriş xətası!', true);
            return;
        }
        localStorage.setItem(TOKEN_KEY, data.token);
        localStorage.setItem(USER_INFO_KEY, data.fullName + ' (' + data.position + ')');
        location.reload();
    }

    async function submitFieldVisit() {
        const counterpartyName = document.getElementById('counterpartyName').value.trim();
        const note = document.getElementById('visitNote').value.trim();
        if (!counterpartyName) {
            showAlert('Zəhmət olmasa Kontragentin adını daxil edin!', true);
            return;
        }

        const token = localStorage.getItem(TOKEN_KEY);
        const res = await fetch('/api/attendance/field-visit', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
            body: JSON.stringify({counterpartyName, note})
        });

        const data = await res.json();
        if (!res.ok) {
            showAlert(data.message || 'Xəta baş verdi!', true);
            return;
        }
        showAlert(data.message, false);
    }
</script>
</body>
</html>
