<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScanIn — Günlük Tapşırıqlarım</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: radial-gradient(circle at top left, #1e293b, #0f172a 75%);
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(30, 41, 59, 0.78);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 28px 22px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65);
            margin-top: 10px;
        }

        .header {
            text-align: center;
            margin-bottom: 22px;
        }

        .brand-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 12px;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.35);
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 13px;
            color: #94a3b8;
        }

        .emp-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 12px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
        }

        /* STATİSTİKA ZOLAĞI */
        .stats-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .stat-pill {
            flex: 1;
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.07);
            padding: 10px 6px;
            border-radius: 14px;
            text-align: center;
        }

        .stat-pill .num {
            font-size: 18px;
            font-weight: 800;
            display: block;
        }

        .stat-pill .lbl {
            font-size: 11px;
            color: #94a3b8;
        }

        /* TAPŞIRIQ KARTLARI (AKKORDEON) */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-card {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            overflow: hidden;
            transition: 0.25s;
        }

        .task-card.active-work {
            border-color: rgba(245, 158, 11, 0.55);
            box-shadow: 0 0 18px rgba(245, 158, 11, 0.12);
        }

        .task-card.done-work {
            border-color: rgba(34, 197, 94, 0.35);
            opacity: 0.88;
        }

        .task-summary {
            padding: 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            user-select: none;
        }

        .task-summary:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .task-left {
            flex: 1;
            text-align: left;
        }

        .task-title {
            font-size: 15px;
            font-weight: 600;
            color: #f1f5f9;
            line-height: 1.4;
            margin-bottom: 6px;
        }

        .task-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 12px;
            color: #94a3b8;
            align-items: center;
        }

        .badge {
            padding: 4px 9px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .b-pending {
            background: rgba(148, 163, 184, 0.18);
            color: #cbd5e1;
        }

        .b-progress {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
        }

        .b-completed {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }

        .b-overdue {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        /* TAPŞIRIĞA BASANDA AÇILAN DETAL VƏ DÜYMƏ HİSSƏSİ */
        .task-details {
            display: none;
            padding: 0 16px 16px 16px;
            border-top: 1px dashed rgba(255, 255, 255, 0.08);
            margin-top: 4px;
            padding-top: 14px;
            text-align: left;
        }

        .task-card.open .task-details {
            display: block;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .time-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: rgba(30, 41, 59, 0.6);
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 12.5px;
            margin-bottom: 14px;
            color: #cbd5e1;
        }

        .time-grid div span {
            display: block;
            font-size: 11px;
            color: #64748b;
        }

        .action-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-start {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #052e16;
            box-shadow: 0 6px 18px rgba(34, 197, 94, 0.3);
        }

        .btn-finish {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
            box-shadow: 0 6px 18px rgba(239, 68, 68, 0.3);
        }

        /* ŞİRİN TƏSDİQ MODALI (SWEET CONFIRM MODAL) */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 999;
        }

        .modal-card {
            width: 100%;
            max-width: 370px;
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 28px 24px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-emoji {
            font-size: 46px;
            margin-bottom: 10px;
            display: block;
        }

        .modal-card h3 {
            font-size: 19px;
            color: #f8fafc;
            margin-bottom: 8px;
        }

        .modal-card p {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 22px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-cancel {
            background: #334155;
            color: #e2e8f0;
        }

        .btn-confirm {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #052e16;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="brand-icon">📋</div>
        <h1>Gündəlik Tapşırıqlarım</h1>
        <p>Tapşırığı başlatmaq və ya bitirmək üçün üzərinə toxunun</p>
        <div id="empBadge" class="emp-badge">👤 Yüklənir...</div>
    </div>

    <div class="stats-bar">
        <div class="stat-pill">
            <span class="num" id="cntPending" style="color:#cbd5e1;">0</span>
            <span class="lbl">Gözləyir</span>
        </div>
        <div class="stat-pill">
            <span class="num" id="cntProgress" style="color:#fbbf24;">0</span>
            <span class="lbl">İcradadır</span>
        </div>
        <div class="stat-pill">
            <span class="num" id="cntDone" style="color:#4ade80;">0</span>
            <span class="lbl">Bitib</span>
        </div>
    </div>

    <div id="tasksList" class="task-list">
        <div style="text-align:center; color:#94a3b8; padding:24px;">Yüklənir...</div>
    </div>
</div>

<!-- ŞİRİN BİTİRMƏ TƏSDİQ PƏNCƏRƏSİ -->
<div id="sweetModal" class="modal-overlay hidden">
    <div class="modal-card">
        <span class="modal-emoji">🌟</span>
        <h3>Əla gedirsən!</h3>
        <p id="sweetModalText">Bu tapşırığı tam bitirdiyindən əminsən? Bəlkə kiçik bir detal yaddan çıxıb, bir də göz
            gəzdirmək istəyərsən? 😊</p>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeSweetModal()">🔍 Bir də baxım</button>
            <button class="btn-confirm" onclick="confirmFinishTask()">✅ Tam əminəm, bitdi!</button>
        </div>
    </div>
</div>

<script>
    const TOKEN_KEY = 'scanin_jwt_token';
    const USER_INFO_KEY = 'scanin_user_info';
    let selectedTaskIdForFinish = null;
    let openAccordionId = null;

    window.onload = () => {
        const token = localStorage.getItem(TOKEN_KEY);
        if (!token) {
            // Əgər işçi ilk dəfə birbaşa masa QR-nı oxudubsa, aktivləşdirmə üçün index.html-ə yönləndirək:
            window.location.href = '/index.html';
            return;
        }
        const info = localStorage.getItem(USER_INFO_KEY);
        if (info) document.getElementById('empBadge').innerText = '👤 ' + info;
        loadMyTasks();
    };

    async function loadMyTasks() {
        const token = localStorage.getItem(TOKEN_KEY);
        const res = await fetch('/api/tasks/my', {
            headers: {'Authorization': 'Bearer ' + token}
        });

        if (res.status === 401 || res.status === 403) {
            window.location.href = '/index.html';
            return;
        }

        const tasks = await res.json();
        renderTasks(tasks);
    }

    function renderTasks(tasks) {
        const listEl = document.getElementById('tasksList');
        listEl.innerHTML = '';

        let p = 0, prog = 0, done = 0;
        tasks.forEach(t => {
            if (t.status === 'PENDING') p++;
            else if (t.status === 'IN_PROGRESS') prog++;
            else if (t.status === 'COMPLETED') done++;
        });

        document.getElementById('cntPending').innerText = p;
        document.getElementById('cntProgress').innerText = prog;
        document.getElementById('cntDone').innerText = done;

        if (tasks.length === 0) {
            listEl.innerHTML = `<div style="text-align:center; padding:30px 15px; color:#94a3b8;">
                🎉 Hazırda aktiv tapşırığınız yoxdur! Раhat nəfəs ala bilərsiniz.
            </div>`;
            return;
        }

        tasks.forEach((t, idx) => {
            const isOpen = (openAccordionId === t.id) ? 'open' : '';
            const cardState = t.status === 'IN_PROGRESS' ? 'active-work' : (t.status === 'COMPLETED' ? 'done-work' : '');

            let badgeHtml = '';
            if (t.status === 'PENDING') badgeHtml = `<span class="badge b-pending">⏳ Gözləyir</span>`;
            else if (t.status === 'IN_PROGRESS') badgeHtml = `<span class="badge b-progress">🔥 İcradadır</span>`;
            else badgeHtml = `<span class="badge b-completed">✅ Bitdi (${t.spentMinutes} dəq)</span>`;

            const deadlineStr = formatDateTime(t.deadline);
            const startStr = t.startedAt ? formatDateTime(t.startedAt) : 'Hələ başlanmayıb';
            const endStr = t.completedAt ? formatDateTime(t.completedAt) : (t.status === 'IN_PROGRESS' ? 'Davam edir...' : '—');

            let actionBtnHtml = '';
            if (t.status === 'PENDING') {
                actionBtnHtml = `<button class="action-btn btn-start" onclick="startTask(event, ${t.id})">▶️ TAPŞIRIĞA BAŞLA</button>`;
            } else if (t.status === 'IN_PROGRESS') {
                actionBtnHtml = `<button class="action-btn btn-finish" onclick="openSweetModal(event, ${t.id}, '${t.title.replace(/'/g, "\\'")}')">⏹️ TAPŞIRIĞI BİTİR</button>`;
            } else {
                actionBtnHtml = `<div style="text-align:center; color:#4ade80; font-size:13px; font-weight:600; padding:6px;">🎉 Bu tapşırığı uğurla tamamlamısınız! (Sərf olunan vaxt: ${t.spentMinutes} dəqiqə)</div>`;
            }

            listEl.innerHTML += `
                <div class="task-card ${cardState} ${isOpen}" id="tcard-${t.id}">
                    <div class="task-summary" onclick="toggleTask(${t.id})">
                        <div class="task-left">
                            <div class="task-title">${idx + 1}. ${t.title}</div>
                            <div class="task-meta">
                                <span>⏰ Son vaxt: <b style="color:${t.overdue ? '#f87171' : '#e2e8f0'}">${deadlineStr}</b></span>
                                ${t.overdue ? '<span class="badge b-overdue">⚠️ Vaxtı keçib</span>' : ''}
                            </div>
                        </div>
                        <div>${badgeHtml}</div>
                    </div>

                    <div class="task-details">
                        ${t.description ? `<p style="font-size:13px; color:#cbd5e1; margin-bottom:12px;">📝 <b>Detal:</b> ${t.description}</p>` : ''}
                        <div class="time-grid">
                            <div><span>🟢 Başlama vaxtı:</span> <b>${startStr}</b></div>
                            <div><span>🏁 Bitmə vaxtı:</span> <b>${endStr}</b></div>
                        </div>
                        ${actionBtnHtml}
                    </div>
                </div>
            `;
        });
    }

    function toggleTask(id) {
        const card = document.getElementById('tcard-' + id);
        const wasOpen = card.classList.contains('open');
        document.querySelectorAll('.task-card').forEach(c => c.classList.remove('open'));
        if (!wasOpen) {
            card.classList.add('open');
            openAccordionId = id;
        } else {
            openAccordionId = null;
        }
    }

    async function startTask(e, id) {
        e.stopPropagation();
        const token = localStorage.getItem(TOKEN_KEY);
        const res = await fetch(`/api/tasks/${id}/start`, {
            method: 'POST',
            headers: {'Authorization': 'Bearer ' + token}
        });
        if (res.ok) {
            openAccordionId = id;
            loadMyTasks();
        }
    }

    function openSweetModal(e, id, title) {
        e.stopPropagation();
        selectedTaskIdForFinish = id;
        document.getElementById('sweetModalText').innerHTML = `<b>"${title}"</b> tapşırığını tam bitirdiyindən əminsən? <br><br>Bəlkə kiçik bir detal yaddan çıxıb, son dəfə yoxlamaq istəyərsən? 😊`;
        document.getElementById('sweetModal').classList.remove('hidden');
    }

    function closeSweetModal() {
        selectedTaskIdForFinish = null;
        document.getElementById('sweetModal').classList.add('hidden');
    }

    async function confirmFinishTask() {
        if (!selectedTaskIdForFinish) return;
        const token = localStorage.getItem(TOKEN_KEY);
        const res = await fetch(`/api/tasks/${selectedTaskIdForFinish}/complete`, {
            method: 'POST',
            headers: {'Authorization': 'Bearer ' + token}
        });
        closeSweetModal();
        if (res.ok) {
            loadMyTasks();
        }
    }

    function formatDateTime(dtStr) {
        if (!dtStr) return '—';
        const d = new Date(dtStr);
        return d.toLocaleDateString('az-AZ', {day: '2-digit', month: '2-digit'}) + ' ' +
            d.toLocaleTimeString('az-AZ', {hour: '2-digit', minute: '2-digit'});
    }
</script>
</body>
</html>
