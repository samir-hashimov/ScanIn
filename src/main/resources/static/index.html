<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScanIn — Ofis Giriş-Çıxış Sistemi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body {
            background: radial-gradient(circle at top left, #1e293b, #0f172a 70%);
            color: #f8fafc; min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }

        .card {
            width: 100%; max-width: 430px;
            background: rgba(30, 41, 59, 0.78);
            backdrop-filter: blur(18px);
            padding: 36px 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65);
            text-align: center;
        }

        .brand-icon {
            width: 62px; height: 62px; margin: 0 auto 14px;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            border-radius: 18px; display: flex; align-items: center; justify-content: center;
            font-size: 28px; box-shadow: 0 10px 25px rgba(56, 189, 248, 0.35);
        }
        h1 { font-size: 25px; font-weight: 700; color: #f8fafc; margin-bottom: 6px; }
        .subtitle { font-size: 14px; color: #94a3b8; margin-bottom: 24px; }

        /* TAB DÜYMƏLƏRİ */
        .tabs {
            display: flex; gap: 8px; margin-bottom: 22px;
            background: rgba(15, 23, 42, 0.6); padding: 6px; border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .tab-btn {
            flex: 1; padding: 10px; border: none; border-radius: 10px;
            background: transparent; color: #94a3b8; cursor: pointer;
            font-weight: 600; font-size: 14px; transition: 0.25s;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #0f172a; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        /* XƏTA BİLDİRİŞ QUTUSU */
        .error-alert {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #fca5a5; padding: 12px 14px; border-radius: 12px;
            font-size: 13.5px; font-weight: 500; margin-bottom: 18px;
            text-align: left; display: flex; align-items: center; gap: 10px;
            animation: shake 0.35s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        /* INPUT XANALARI */
        .form-group { text-align: left; margin-bottom: 16px; position: relative; }
        label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 7px; }
        input, textarea {
            width: 100%; padding: 13px 15px; border-radius: 12px;
            border: 1px solid #334155; background: rgba(15, 23, 42, 0.85);
            color: #fff; font-size: 15px; outline: none; transition: 0.2s;
        }
        input:focus, textarea:focus {
            border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }
        .toggle-pass {
            position: absolute; right: 14px; top: 38px; cursor: pointer;
            color: #64748b; font-size: 16px; user-select: none;
        }

        /* DÜYMƏLƏR */
        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 12px;
            font-size: 15.5px; font-weight: 700; cursor: pointer; transition: 0.25s; margin-top: 6px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #38bdf8, #0284c7); color: #0f172a;
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.25);
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(56, 189, 248, 0.4); color: #fff; }
        .btn-warning {
            background: linear-gradient(135deg, #fbbf24, #d97706); color: #0f172a;
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.25);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1); color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.15); margin-top: 10px;
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.18); }

        /* QR OXUTMA NƏTİCƏ EKRANI (NÖVBƏTİ GÜNLƏRDƏ BİRBAŞA AÇILAN HİSSƏ) */
        .emp-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8; padding: 7px 16px; border-radius: 999px;
            font-size: 13.5px; font-weight: 600; margin-bottom: 18px;
        }
        .result-icon {
            font-size: 48px; margin-bottom: 12px; display: block;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.4); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .status-box {
            padding: 22px 18px; border-radius: 16px; margin-top: 8px;
            line-height: 1.55; font-size: 16px; font-weight: 500;
        }
        .status-success {
            background: rgba(34, 197, 94, 0.12); border: 1px solid rgba(34, 197, 94, 0.45); color: #bbf7d0;
        }
        .status-warning {
            background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.45); color: #fde68a;
        }
        .status-error {
            background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.45); color: #fecaca;
        }

        .time-stamp {
            margin-top: 12px; font-size: 12.5px; color: #94a3b8;
        }
        .hidden { display: none !important; }
        .logout-link {
            display: inline-block; margin-top: 24px; font-size: 12px;
            color: #64748b; text-decoration: underline; cursor: pointer; transition: 0.2s;
        }
        .logout-link:hover { color: #94a3b8; }
    </style>
</head>
<body>

<div class="card">
    <div class="brand-icon">⚡</div>
    <h1>ScanIn</h1>
    <p class="subtitle">Ofis Giriş-Çıxış Sistemi</p>

    <!-- 1. AUTH BÖLMƏSİ (Yalnız 1-ci dəfə telefonda Token olmayanda görünür) -->
    <div id="authSection" class="hidden">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('activate')">İlk Aktivləşdirmə</button>
            <button class="tab-btn" onclick="switchTab('login')">Daxil Ol (Login)</button>
        </div>

        <!-- Xəta Bildiriş Qutusu -->
        <div id="authErrorBox" class="error-alert hidden">
            <span>⚠️</span>
            <span id="authErrorText">Xəta baş verdi!</span>
        </div>

        <!-- İlk dəfə EMP-001 ilə aktivləşdirmə formu -->
        <div id="activateForm">
            <div class="form-group">
                <label>HR-ın verdiyi İşçi Kodu (məs: EMP-001)</label>
                <input type="text" id="actEmpCode" placeholder="EMP-001" style="text-transform: uppercase;">
            </div>
            <div class="form-group">
                <label>Özünüzə İstifadəçi Adı seçin</label>
                <input type="text" id="actUsername" placeholder="nickname" autocomplete="username">
            </div>
            <div class="form-group">
                <label>Özünüzə Şifrə təyin edin (min 6 simvol)</label>
                <input type="password" id="actPassword" placeholder="••••••••" autocomplete="new-password">
                <span class="toggle-pass" onclick="togglePass('actPassword')">👁️</span>
            </div>
            <button id="actBtn" class="btn btn-primary" onclick="activateAccount()">Hesabı Aktivləşdir və Giriş Et</button>
        </div>

        <!-- Mövcud hesabla Login formu -->
        <div id="loginForm" class="hidden">
            <div class="form-group">
                <label>İstifadəçi Adı</label>
                <input type="text" id="loginUsername" placeholder="nickname" autocomplete="username">
            </div>
            <div class="form-group">
                <label>Şifrə</label>
                <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
                <span class="toggle-pass" onclick="togglePass('loginPassword')">👁️</span>
            </div>
            <button id="loginBtn" class="btn btn-primary" onclick="loginAccount()">Daxil Ol və QR Oxut</button>
        </div>
    </div>

    <!-- 2. BİRBAŞA QR TƏSDİQ EKRANI (Növbəti günlərdə heç nə soruşmadan birbaşa bura açılır!) -->
    <div id="scanSection" class="hidden">
        <div id="employeeBadge" class="emp-badge">👤 Yüklənir...</div>

        <div id="messageBox" class="status-box status-success">
            <span id="resultIcon" class="result-icon">⏳</span>
            <div id="resultMessage">QR Kod yoxlanılır, zəhmət olmasa gözləyin...</div>
            <div id="resultTime" class="time-stamp"></div>
        </div>

        <!-- 30+ dəqiqə gecikəndə açılan Səbəb Qutusu -->
        <div id="lateReasonBox" class="hidden" style="margin-top: 18px;">
            <div class="form-group">
                <label>📝 Gecikmə səbəbinizi qeyd edin (min 5 simvol):</label>
                <textarea id="lateReasonInput" rows="3" placeholder="Gecikmə səbəbini bura yazın..."></textarea>
            </div>
            <button class="btn btn-warning" onclick="submitReason(false)">Səbəbi Təsdiqlə və Göndər</button>
        </div>

        <!-- 10 dəqiqə içində təkrar oxudanda açılan Cooldown Qutusu -->
        <div id="earlyLeaveBox" class="hidden" style="margin-top: 18px;">
            <button class="btn btn-secondary" onclick="cancelEarlyLeave()">😅 Əlim dəydi, ofisdə qalıram</button>
            <div class="form-group" style="margin-top: 16px;">
                <label>🚪 Həqiqətən təcili çıxırsınızsa, səbəbini yazın:</label>
                <textarea id="earlyLeaveInput" rows="2" placeholder="Erkən çıxış səbəbini bura yazın..."></textarea>
            </div>
            <button class="btn btn-warning" onclick="submitReason(true)">Səbəbi Yaz və Çıxış Et</button>
        </div>

        <span class="logout-link" onclick="logoutDevice()">Başqa hesabla girmək üçün cihazdan çıxış et</span>
    </div>
</div>

<script>
    const TOKEN_KEY = 'scanin_jwt_token';
    const USER_INFO_KEY = 'scanin_user_info';

    // Səhifə açılan saniyədə işə düşür:
    window.onload = () => {
        const token = localStorage.getItem(TOKEN_KEY);
        if (!token) {
            // Yalnız 1-ci dəfə (Token yoxdursa) qeydiyyat ekranını göstər:
            document.getElementById('authSection').classList.remove('hidden');
        } else {
            // Token varsa -> Qeydiyyat səhifəsini HEÇ GÖSTƏRMƏ, birbaşa bazaya yaz və mesajı çıxar!
            document.getElementById('scanSection').classList.remove('hidden');
            performQrScan(null);
        }
    };

    function togglePass(inputId) {
        const inp = document.getElementById(inputId);
        inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    function showAuthError(msg) {
        const errBox = document.getElementById('authErrorBox');
        document.getElementById('authErrorText').innerText = msg;
        errBox.classList.remove('hidden');
        errBox.style.animation = 'none';
        errBox.offsetHeight;
        errBox.style.animation = null;
    }

    function switchTab(tab) {
        document.getElementById('authErrorBox').classList.add('hidden');
        const btns = document.querySelectorAll('.tab-btn');
        if (tab === 'activate') {
            btns[0].classList.add('active'); btns[1].classList.remove('active');
            document.getElementById('activateForm').classList.remove('hidden');
            document.getElementById('loginForm').classList.add('hidden');
        } else {
            btns[1].classList.add('active'); btns[0].classList.remove('active');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('activateForm').classList.add('hidden');
        }
    }

    // 1. İlk dəfə EMP-001 kodu ilə aktivləşdirmə:
    async function activateAccount() {
        const employeeCode = document.getElementById('actEmpCode').value.trim();
        const username = document.getElementById('actUsername').value.trim();
        const password = document.getElementById('actPassword').value;

        if (!employeeCode || !username || !password) {
            showAuthError('Zəhmət olmasa bütün xanaları doldurun!');
            return;
        }
        await sendAuthRequest('/api/auth/activate', { employeeCode, username, password });
    }

    // 2. Mövcud hesabla Login:
    async function loginAccount() {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (!username || !password) {
            showAuthError('Zəhmət olmasa istifadəçi adı və şifrəni daxil edin!');
            return;
        }
        await sendAuthRequest('/api/auth/login', { username, password });
    }

    async function sendAuthRequest(url, payload) {
        document.getElementById('authErrorBox').classList.add('hidden');
        try {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const rawText = await res.text();
            let data = {};
            try { data = rawText ? JSON.parse(rawText) : {}; } catch (e) { data = {}; }

            if (!res.ok) {
                let errMsg = data.message || 'Məlumatlar yanlışdır!';
                if (data.details) {
                    errMsg = Object.values(data.details).join(' | ');
                }
                showAuthError(errMsg);
                return;
            }

            // 1 illik Token-i telefonun yaddaşına yazırıq:
            localStorage.setItem(TOKEN_KEY, data.token);
            localStorage.setItem(USER_INFO_KEY, data.fullName + ' (' + data.position + ')');

            // Auth bölməsini gizlədib dərhal QR Scan edirik:
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('scanSection').classList.remove('hidden');
            performQrScan(null);

        } catch (err) {
            showAuthError('Serverlə əlaqə yaratmaq mümkün olmadı!');
        }
    }

    // 3. Əsas QR Oxutma Sorğusu (POST /api/attendance/scan):
    async function performQrScan(bodyPayload) {
        const token = localStorage.getItem(TOKEN_KEY);
        const savedInfo = localStorage.getItem(USER_INFO_KEY);
        if (savedInfo) document.getElementById('employeeBadge').innerText = '👤 ' + savedInfo;

        const msgBox = document.getElementById('messageBox');
        const iconEl = document.getElementById('resultIcon');
        const textEl = document.getElementById('resultMessage');
        const timeEl = document.getElementById('resultTime');

        document.getElementById('lateReasonBox').classList.add('hidden');
        document.getElementById('earlyLeaveBox').classList.add('hidden');

        try {
            const res = await fetch('/api/attendance/scan', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: bodyPayload ? JSON.stringify(bodyPayload) : null
            });

            const rawText = await res.text();
            let data = {};
            try { data = rawText ? JSON.parse(rawText) : {}; } catch (e) { data = {}; }

            if (res.status === 401 || (res.status === 403 && !data.error)) {
                logoutDevice();
                return;
            }

            const nowStr = new Date().toLocaleTimeString('az-AZ', { hour: '2-digit', minute: '2-digit' });
            timeEl.innerText = '🕒 Qeyd saatı: ' + nowStr;

            if (!res.ok) {
                msgBox.className = 'status-box status-error';
                iconEl.innerText = '❌';
                textEl.innerText = data.message || 'Xəta baş verdi!';
                return;
            }

            if (data.employeeInfo) {
                document.getElementById('employeeBadge').innerText = '👤 ' + data.employeeInfo;
            }

            textEl.innerText = data.message;

            // 30+ dəqiqə gecikibsə Səbəb Qutusunu aç:
            if (data.requiresLateReason) {
                msgBox.className = 'status-box status-warning';
                iconEl.innerText = '⏰';
                document.getElementById('lateReasonBox').classList.remove('hidden');
            }
            // 10 dəqiqə içində təkrar oxudubsa Cooldown seçimini aç:
            else if (data.requiresEarlyLeaveConfirmation) {
                msgBox.className = 'status-box status-warning';
                iconEl.innerText = '👀';
                document.getElementById('earlyLeaveBox').classList.remove('hidden');
            }
            else {
                msgBox.className = 'status-box status-success';
                iconEl.innerText = '✅';
            }

        } catch (err) {
            msgBox.className = 'status-box status-error';
            iconEl.innerText = '❌';
            textEl.innerText = 'Serverlə əlaqə yaratmaq mümkün olmadı!';
        }
    }

    // 4. Gecikmə və ya Erkən Çıxış səbəbini göndərmək:
    function submitReason(isEarlyLeave) {
        const reasonText = isEarlyLeave
            ? document.getElementById('earlyLeaveInput').value
            : document.getElementById('lateReasonInput').value;

        performQrScan({
            reason: reasonText,
            forceEarlyCheckout: isEarlyLeave
        });
    }

    function cancelEarlyLeave() {
        const msgBox = document.getElementById('messageBox');
        msgBox.className = 'status-box status-success';
        document.getElementById('resultIcon').innerText = '👍';
        document.getElementById('resultMessage').innerText = 'Əla! İşinizdə davam edə bilərsiniz, çıxış qeydə alınmadı.';
        document.getElementById('earlyLeaveBox').classList.add('hidden');
    }

    function logoutDevice() {
        localStorage.removeItem(TOKEN_KEY);
        localStorage.removeItem(USER_INFO_KEY);
        location.reload();
    }
</script>
</body>
</html>
