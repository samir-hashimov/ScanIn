spring.application.name=ScanIn

# Server Portu
server.port=${SERVER_PORT:8080}

# 1. Məlumat Bazası (PostgreSQL) Bağlantısı
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scanin_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. JPA / Hibernate Ayarları (Cədvəlləri Flyway yaratdığı üçün validate edirik)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# 3. Flyway Miqrasiya Ayarları
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# 4. JWT Təhlükəsizlik Ayarları (Default: 1 il = 31536000000 ms)
jwt.secret=${JWT_SECRET:ScanInSuperSecretKeyForJwtAuthentication2026OfficeProject!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:31536000000}

# 5. Ofis Wi-Fi IP Yoxlama Ayarları
office.ip.is-static=${OFFICE_IP_IS_STATIC:true}
office.ip.static-value=${OFFICE_IP_STATIC_VALUE:127.0.0.1}
office.ip.secret-key=${OFFICE_IP_SECRET_KEY:ScanInSecret2026}